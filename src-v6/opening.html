 <section id="home" inert><button id="homeHelp" class="help-button" data-i18n-aria="tutorial">?</button><h1 class="title-mark" aria-label="墨"><img src="../assets/home/menu-reference.png" alt="" draggable="false"></h1><nav class="menu"><button id="grindBtn" class="brush selected" data-i18n="grind">开始</button><button id="albumBtn" class="brush" data-i18n="gallery">画廊</button><button id="settingsBtn" class="brush" data-i18n="settings">设定</button></nav></section>

<dialog id="settings"><div class="panel">

<label><span data-i18n="bgmTrack"></span><select id="bgmTrack"></select></label>

<label><span data-i18n="quality"></span><select id="quality"><option value="high" data-i18n="high"></option><option value="balanced" data-i18n="balanced"></option><option value="performance" data-i18n="performance"></option></select></label>
<label><span data-i18n="homeVisual"></span><select id="homeVisual"><option value="paper" data-i18n="paperHome"></option><option value="painting" data-i18n="paintingHome"></option></select></label>
<button id="materialNoticeBtn" type="button" class="text-link" data-i18n="materialNotice"></button>
<button id="closeSettings" class="ink-button" data-i18n="back"></button></div></dialog>

<script type="module">
import('./opening-scene.mjs').catch(error=>{
 console.error('BOKU opening:',error);
 const overlay=document.getElementById('loading'),retry=overlay.querySelector('[data-retry]');
 overlay.classList.add('load-failed');overlay.setAttribute('aria-busy','false');
 document.getElementById('loadingText').textContent='加载失败 / 読み込みに失敗しました / Load failed';
 retry.hidden=false;retry.onclick=()=>parent.location.reload();
});
</script>
