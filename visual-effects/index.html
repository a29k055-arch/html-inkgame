<html lang="ja"><head><base href="../prototypes/ink/"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>墨水視覚効果制作 · 水墨表現</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div class="identity"><span class="edition">視覚効果・水墨表現</span><h1>墨</h1><p>流れ、ほどけ、紙に宿る。</p></div><nav aria-label="表現を選ぶ"><button data-mode="player" aria-pressed="true"><small>一</small>墨のかたち</button><button data-mode="painting" aria-pressed="false"><small>二</small>インタラクティブ墨</button><button data-mode="paper" aria-pressed="false"><small>三</small>宣紙表現</button></nav><div class="tools"><label>画質 <select id="quality"><option value="high">高画質</option><option value="balanced">バランス</option><option value="performance">省電力</option></select></label><label id="sizeControl">墨の大きさ <input id="size" type="range" min="0.028" max="0.100" step="0.004" value="0.052" aria-label="墨の大きさ"></label><label id="backgroundControl" hidden>背景 <select id="background"><option value="blank">白い画布</option><option value="paper">宣紙の水墨画</option></select></label><button id="auto" aria-pressed="true">自動デモ：オン</button><button id="reset">墨を洗い流す</button><a href="../../outputs/ink_demo_v2.html">旧版を遊ぶ ↗</a></div><p class="phase">流体で描く、水墨の試作</p></aside><main><header><div><span id="number">表現 01</span><h2 id="title">墨のかたち</h2></div><output id="stats" aria-label="描画の状態">準備中</output></header><div id="stage"><canvas id="paper" aria-label="原画の復元"></canvas><canvas id="fluid" aria-label="マウスや指で動かせる墨"></canvas><canvas id="body"></canvas><div id="loading"><span>墨</span><p>墨と水を整えています</p></div><div id="error" hidden></div><div class="seal" aria-hidden="true">試<br>墨</div><div id="completion" hidden><span>復元</span><strong>0.0%</strong></div></div><footer><p id="hint">マウス・WASDで移動 ／ Shiftで勢いをつける</p><button id="burst">墨を散らす</button><button id="guide" hidden aria-pressed="false">原画を見る</button></footer></main><script type="module" src="src/app.js"></script></body></html>
